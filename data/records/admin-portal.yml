kind: project
name: admin-portal
slug: admin-portal
description: Invoice Ninja's operator-side admin portal, a single Flutter codebase shipped to
  Android, iOS, macOS, Windows, Linux, and web that manages the full billing lifecycle — quotes,
  invoices, recurring invoices, credits, purchase orders, payments, expenses, projects, and time
  tracking — against a self-hosted or cloud Invoice Ninja v5 server.
summary: One Flutter/Redux client that Invoice Ninja ships to six platforms, including the Microsoft
  Store, Mac App Store, Snap, Flatpak, and F-Droid, so a business owner gets the same invoicing
  console on a desktop as on a phone. Roughly thirty business entities are modelled client-side with
  built_value immutables, and the settings surface exposes both the payment-gateway matrix and a
  long list of regional e-invoicing formats.
