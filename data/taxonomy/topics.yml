# Curated tag vocabulary. Each entry is a concept that is:
#   - useful as a discovery facet (e.g. "self-hosted" tells the
#     reader something they cannot infer from category / stack /
#     platform alone),
#   - short enough to render as a chip,
#   - stable enough that consumers can rely on the id across
#     imports.
#
# Records can still carry arbitrary tags on disk (e.g. one-off
# GitHub topics inherited from the awesome-list source). The
# browse dropdown + submit-form suggestions filter to this list
# so the dropdown stays scannable. The full tag list continues to
# power the detail-page chips and the text search.
