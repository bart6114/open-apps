name: Validate app data

on:
  pull_request:
    paths:
      - "data/apps/**"
      - "data/taxonomy/**"
      - "scripts/**"
      - "docs/SCHEMA.md"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate YAML schema
        run: npm run validate:data

      - name: Build generated data
        run: npm run build:data
