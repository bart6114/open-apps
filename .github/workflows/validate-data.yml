name: Validate app data

on:
  pull_request:
    paths:
      - "data/apps/**"
      - "data/taxonomy/**"
      - "scripts/**"
      - "docs/SCHEMA.md"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate YAML schema
        run: pnpm run validate:data

      - name: Build generated data
        run: pnpm run build:data

      - name: Run unit tests
        run: pnpm test
