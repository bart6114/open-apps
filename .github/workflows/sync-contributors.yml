name: Sync contributors

# Weekly on Mondays at 07:00 UTC. Refreshes `src/data/contributors.ts`
# from the GitHub REST API and opens a PR if anything changed. The site
# is rebuilt on merge.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync contributors from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run sync:contributors

      - name: Validate generated data
        run: pnpm run build:data

      - name: Open PR if anything changed
        run: |
          if [ -n "$(git diff --name-only src/data/contributors.ts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b chore/sync-contributors-$(date -u +%Y%m%d)
            git add src/data/contributors.ts
            git commit -m "chore(data): sync contributors from GitHub"
            git push -u origin HEAD
            gh pr create \
              --title "chore(data): sync contributors from GitHub" \
              --body "Weekly refresh of repo contributors from the GitHub REST API." \
              --head "$(git rev-parse --abbrev-ref HEAD)" \
              --base main
          else
            echo "No changes detected — skipping PR."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
