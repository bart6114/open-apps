name: Sync GitHub metadata

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max schemaVersion: 1 apps to sync (0 = all)"
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-metadata.mjs "${{ github.event.inputs.limit || '0' }}"

      - name: Validate generated data
        run: npm run build:data

      - name: Open PR if anything changed
        run: |
          if [ -n "$(git diff --name-only data/apps/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b chore/sync-github-metadata-$(date -u +%Y%m%d)
            git add data/apps/
            git commit -m "chore(data): sync GitHub metadata"
            git push -u origin HEAD
            gh pr create \
              --title "chore(data): sync GitHub metadata" \
              --body "Automated sync of GitHub-shaped metadata for schemaVersion: 1 app records." \
              --head "$(git rev-parse --abbrev-ref HEAD)" \
              --base main
          else
            echo "No changes detected - skipping PR."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
